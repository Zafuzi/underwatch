name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            binary: underwatch
          - os: macos-latest
            name: macos
            binary: underwatch
          - os: windows-latest
            name: windows
            binary: underwatch.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # Building SDL3 from source on Linux needs the X11/Wayland (and audio)
        # dev headers present; the bare ubuntu-latest image doesn't ship them.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            wayland-protocols libwayland-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libasound2-dev libpulse-dev

      - name: Configure
        # Vendoring SDL3 from source keeps the build self-contained and identical
        # across all three runners, instead of depending on whatever (if anything)
        # is preinstalled on each image.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUNDERWATCH_VENDOR_SDL3=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "build/Release/${{ matrix.binary }}" ]; then
            cp "build/Release/${{ matrix.binary }}" dist/
          else
            cp "build/${{ matrix.binary }}" dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: underwatch-${{ matrix.name }}
          path: dist/*

  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9

      - name: Configure
        # Same reasoning as the vendored-SDL3 path above: there's no system SDL3
        # for wasm, so it's always built from source against the Emscripten toolchain.
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm --parallel

      - name: Stage build
        run: |
          mkdir -p dist
          cp build-wasm/underwatch.html build-wasm/underwatch.js build-wasm/underwatch.wasm dist/
          # itch.io's HTML5 embed looks for index.html by default.
          cp build-wasm/underwatch.html dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: underwatch-wasm
          path: dist/*

  release:
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      HAS_BUTLER_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create GitHub Release
        # Independent of the itch.io publish below: a GitHub-side failure here
        # (permissions, API hiccup, etc.) shouldn't stop the itch.io push.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install butler
        if: always() && env.HAS_BUTLER_KEY == 'true'
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Publish to itch.io
        if: always() && env.HAS_BUTLER_KEY == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler/butler push artifacts/underwatch-linux.zip zafuzi/underwatch:linux
          ./butler/butler push artifacts/underwatch-macos.zip zafuzi/underwatch:mac
          ./butler/butler push artifacts/underwatch-windows.zip zafuzi/underwatch:windows
          ./butler/butler push artifacts/underwatch-wasm.zip zafuzi/underwatch:html5
